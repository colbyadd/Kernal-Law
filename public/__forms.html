<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Netlify Forms</title>
</head>

<body>
    <!-- 
      Canonical Netlify form definition for the contact form.
      Fields, honeypot, and hidden inputs must EXACTLY match ContactForm.tsx.
    -->
    <form name="contact" netlify netlify-honeypot="bot-field" method="POST" action="/success" hidden>
        <input type="text" name="name" />
        <input type="tel" name="phone" />
        <input type="email" name="email" />
        <input type="text" name="case_type" />
        <input type="text" name="urgency" />
        <input type="text" name="preferred_contact_method" />
        <textarea name="message"></textarea>
        <input type="hidden" name="subject" value="New Case Evaluation Request - Kernal Law" />
        <input type="hidden" name="form-name" value="contact" />
        <input type="hidden" name="page_path" />
        <input type="hidden" name="page_type" />
        <input type="hidden" name="landing_page" />
        <input type="hidden" name="referrer" />
        <input type="hidden" name="lead_source" />
        <input type="hidden" name="phone_variant" />
        <input type="hidden" name="cta_variant" />
        <input type="hidden" name="utm_source" />
        <input type="hidden" name="utm_medium" />
        <input type="hidden" name="utm_campaign" />
        <input type="hidden" name="utm_term" />
        <input type="hidden" name="utm_content" />
        <input type="hidden" name="gclid" />
        <input type="hidden" name="gbraid" />
        <input type="hidden" name="wbraid" />
        <input type="hidden" name="msclkid" />
        <input type="hidden" name="fbclid" />
        <!-- Honeypot -->
        <input name="bot-field" />
    </form>
</body>

</html>
