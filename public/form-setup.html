<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Netlify Forms</title>
</head>

<body>
    <!-- 
      Secondary form definition (kept for backward compatibility since ContactForm.tsx 
      posts to /form-setup.html). Fields match __forms.html and ContactForm.tsx exactly.
    -->
    <form name="contact" netlify netlify-honeypot="bot-field" method="POST" action="/success" hidden>
        <input type="text" name="name" />
        <input type="tel" name="phone" />
        <input type="email" name="email" />
        <textarea name="message"></textarea>
        <input type="hidden" name="subject" value="New Case Evaluation Request - Kernal Law" />
        <input type="hidden" name="form-name" value="contact" />
        <!-- Honeypot -->
        <input name="bot-field" />
    </form>
</body>

</html>
